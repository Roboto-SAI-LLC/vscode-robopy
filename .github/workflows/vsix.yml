name: vsix
on:
  push:
    tags: ["v*"]
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @vscode/vsce
      - run: vsce package --allow-missing-repository
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: "*.vsix"
